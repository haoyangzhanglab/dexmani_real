[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexmani_real"
version = "0.0.1"
description = "VR teleoperation, data collection, and policy deployment for dexterous manipulation research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23,<2",
    "scipy>=1.10",
    "PyYAML>=6",
    "h5py>=3.8",
    "zarr>=2.16,<3",
    "av>=10",
    "opencv-python>=4.8",
    "transforms3d>=0.4",
    "tqdm",
]

[project.optional-dependencies]
interactive = ["pynput>=1.7"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dexmani_real*"]
exclude = ["examples*", "assets*"]
namespaces = false

[tool.setuptools.package-data]
"dexmani_real.calibration" = ["state/*.json"]
