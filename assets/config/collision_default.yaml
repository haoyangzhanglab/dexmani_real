# ============================================================================
# Collision Configuration — Example YAML
#
# YAML counterpart of ``dexmani_real.planning.CollisionConfig`` dataclass.
# Load:  CollisionConfig.from_yaml("assets/config/collision_default.yaml")
# Save:  cfg.to_yaml("assets/config/collision_default.yaml")
#
# All parameters in meters / world frame unless noted otherwise.
#
# Two complementary safety layers:
#   - Geometric FK: Pinocchio FK computes fingertip world Z → compare to table
#     surface. Zero-cost, no MPlib point cloud needed. DEFAULT.
#   - MPlib point cloud: Dense point cloud added to MPlib octree, used by
#     plan_screw/plan_qpos/IK for avoidance. Costs IK success rate (~53% vs
#     100% without).
# ============================================================================

# ---- Table geometry (world frame) ------------------------------------------
# Table surface height in world frame (meters). Set this to match your
# physical setup: measured table height minus 0.04 m for tabletop thickness
# (ref: T-Rex convention).

table_z_world: 0.0

# ---- Hand geometry (meters, derived from xarm7_xhand_collision.urdf) ------
# Distance from EEF to lowest fingertip (pinky_tip) measured at home hand
# pose via FK on the collision URDF.

hand_extension_below_eef: 0.076

# Minimum fingertip-to-table clearance. When the lowest fingertip's world Z
# drops to (table_z_world + hand_safe_margin), a collision is reported.

hand_safe_margin: 0.03

# ---- Fingertip link IDs (0-indexed, from collision URDF) ------------------
# xarm7_xhand_collision.urdf link order (0-indexed):
#   0-11:  arm (link_base .. custom_eef_link)
#   12-41: hand (right_hand_link .. pinky_tip)
#   Fingertip indices: 20=thumb, 26=index, 31=mid, 36=ring, 41=pinky

fingertip_link_ids: [20, 26, 31, 36, 41]
fingertip_link_names: [thumb_tip, index_tip, mid_tip, ring_tip, pinky_tip]

# ---- Environment collision mode -------------------------------------------
# Collision detection strategy for environment (table / objects).
#
# Options:
#   - geometric_fk       Pinocchio FK fingertip Z detection (fast, accurate, DEFAULT).
#   - mplib_pointcloud   MPlib octree via add_point_cloud() (costs IK success rate).
#   - none               No environment collision detection.

env_collision_mode: geometric_fk

# ---- Path safety step sizes (rad) ------------------------------------------
# Joint-space step size for dense segment collision interpolation during path
# planning. Default 0.02 rad ~ 1.15° (ref: dimos collision_step_size).

collision_step_size: 0.02

# Joint-space step size for fingertip desk-safety path checks (coarser than
# collision_step_size — the desk plane only needs Z-axis sampling).
# Default 0.05 rad ~ 2.9°.

desk_safety_step_rad: 0.05
