name: CPU offline tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64
          python -m pip install 'pip>=25.3'
          python -m pip install --build-constraint requirements-build.txt \
            '.[control,geometry]' 'pin==2.7.0' 'open3d-cpu==0.19.0' pytest
      - name: Run offline tests
        run: python -m pytest -q -p no:cacheprovider
