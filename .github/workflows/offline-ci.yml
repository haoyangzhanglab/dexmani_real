name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install offline verification dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q dexmani_real examples/real

      - name: Ruff
        run: ruff check dexmani_real examples/real tests

      - name: Black
        run: black --check dexmani_real examples/real tests

      - name: isort
        run: isort --check-only dexmani_real examples/real tests

      - name: mypy
        run: mypy dexmani_real/

      - name: Offline tests and coverage ratchet
        run: >-
          pytest -q tests
          --cov=dexmani_real
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=48

      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch="origin/${{ github.base_ref }}" --fail-under=90
