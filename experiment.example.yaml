# 复制为 experiment.yaml；核对当前物理安装/标定，再运行真机入口。
arm:
  ip: "192.168.1.233"
hand:
  comm_type: serial
  device_name: /dev/ttyUSB0
  device_id: 0
camera:
  serial: null  # 填现场 RealSense 序列号；null 使用驱动默认选择
vr:
  port: 8000
policy:
  hand_enabled: true
  recording_enabled: true
  hand_retargeting_type: tag
  max_record_duration_s: 60.0
  episodes_dir: episodes
teleop:
  control_hz: 16.0
environment:
  table:
    enabled: true
    plane_path: dexmani_real/calibration/state/table_plane.json

# Deployment execution budgets: set from the actual experiment; null refuses startup.
# CLI values override these only when explicitly supplied. N/H/A/dt remain Policy-owned.
execution:
  execution_mode: sync
  max_decision_age_s: null
  max_wait_s: null
  max_tick_lateness_s: null
  prefetch_steps: null
  rtc_guidance_cap: null
